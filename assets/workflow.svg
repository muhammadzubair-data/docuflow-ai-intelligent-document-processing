<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1531"/><stop offset="1" stop-color="#18285a"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="360" rx="28" fill="url(#bg)"/><text x="48" y="64" fill="white" font-size="31" font-family="Arial" font-weight="bold">From documents to decisions</text><text x="48" y="96" fill="#9eb4d8" font-size="17" font-family="Arial">Local-first processing · explainable rules · human oversight</text><g font-family="Arial" text-anchor="middle"><rect x="44" y="146" width="205" height="142" rx="18" fill="#233c69" stroke="#2dd4bf"/><text x="146" y="196" fill="#6ee7f9" font-size="38">▤</text><text x="146" y="235" fill="white" font-size="19" font-weight="bold">Upload</text><text x="146" y="260" fill="#b4c7e5" font-size="14">PDF · TXT · CSV · Images*</text><rect x="279" y="146" width="205" height="142" rx="18" fill="#233c69" stroke="#38bdf8"/><text x="381" y="196" fill="#7dd3fc" font-size="38">⌕</text><text x="381" y="235" fill="white" font-size="19" font-weight="bold">Extract</text><text x="381" y="260" fill="#b4c7e5" font-size="14">Text and invoice fields</text><rect x="514" y="146" width="205" height="142" rx="18" fill="#233c69" stroke="#a78bfa"/><text x="616" y="196" fill="#c4b5fd" font-size="38">✓</text><text x="616" y="235" fill="white" font-size="19" font-weight="bold">Validate</text><text x="616" y="260" fill="#b4c7e5" font-size="14">Rules and duplicate flags</text><rect x="749" y="146" width="205" height="142" rx="18" fill="#233c69" stroke="#a78bfa"/><text x="851" y="196" fill="#c4b5fd" font-size="38">✎</text><text x="851" y="235" fill="white" font-size="19" font-weight="bold">Review</text><text x="851" y="260" fill="#b4c7e5" font-size="14">Approve · correct · reject</text><rect x="984" y="146" width="172" height="142" rx="18