name: Python tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Tesseract OCR (same packages as packages.txt)
        run: sudo apt-get update -q && sudo apt-get install -y -q $(cat packages.txt)
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -rs
      - run: python -m compileall -q app.py docuflow
